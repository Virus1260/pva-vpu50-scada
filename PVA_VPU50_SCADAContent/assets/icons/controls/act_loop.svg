<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="loopGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="loopGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="loopShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Upper Loop Arc -->
  <path d="M12 24 A14 14 0 0 1 38 17" fill="none" stroke="url(#loopGrad1)" stroke-width="5" stroke-linecap="round" filter="url(#loopShadow)"/>
  <!-- Upper Arrow Head -->
  <polygon points="34,9 43,17 33,23" fill="url(#loopGrad1)" stroke="#e0f2fe" stroke-width="1.5"/>
  <!-- Lower Loop Arc -->
  <path d="M36 24 A14 14 0 0 1 10 31" fill="none" stroke="url(#loopGrad2)" stroke-width="5" stroke-linecap="round" filter="url(#loopShadow)"/>
  <!-- Lower Arrow Head -->
  <polygon points="14,39 5,31 15,25" fill="url(#loopGrad2)" stroke="#e0f2fe" stroke-width="1.5"/>
  <!-- Center Orbital Core -->
  <circle cx="24" cy="24" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
</svg>
