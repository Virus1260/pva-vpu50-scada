<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="calHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="calBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#08182b"/>
    </linearGradient>
    <radialGradient id="clockMini" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <filter id="calShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Main Calendar Card -->
  <rect x="6" y="10" width="36" height="32" rx="5" fill="url(#calBody)" stroke="#38bdf8" stroke-width="2" filter="url(#calShadow)"/>
  <!-- Top Header Bar -->
  <path d="M6 15 C6 12.2 8.2 10 11 10 L37 10 C39.8 10 42 12.2 42 15 L42 20 L6 20 Z" fill="url(#calHeader)"/>
  <!-- Binder Rings -->
  <rect x="14" y="6" width="4" height="8" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <rect x="30" y="6" width="4" height="8" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <!-- Grid Dots / Cells -->
  <rect x="12" y="24" width="4" height="4" rx="1" fill="#38bdf8" opacity="0.6"/>
  <rect x="20" y="24" width="4" height="4" rx="1" fill="#38bdf8" opacity="0.6"/>
  <rect x="12" y="32" width="4" height="4" rx="1" fill="#38bdf8" opacity="0.6"/>
  <!-- Overlaid Precision Clock Badge on bottom-right -->
  <circle cx="32" cy="32" r="11" fill="url(#clockMini)" stroke="#ffffff" stroke-width="2"/>
  <line x1="32" y1="32" x2="32" y2="25" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="38" y2="32" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="2" fill="#ffffff"/>
</svg>
