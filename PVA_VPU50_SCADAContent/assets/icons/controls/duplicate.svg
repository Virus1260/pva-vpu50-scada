<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="backSheet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="frontSheet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="plusGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="dupShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Sheet -->
  <rect x="8" y="8" width="24" height="28" rx="4" fill="url(#backSheet)" stroke="#0ea5e9" stroke-width="1.5" filter="url(#dupShadow)"/>
  <!-- Front Sheet -->
  <rect x="16" y="14" width="24" height="28" rx="4" fill="url(#frontSheet)" stroke="#7dd3fc" stroke-width="2" filter="url(#dupShadow)"/>
  <!-- Front Sheet Gloss Bar -->
  <path d="M18 16 L38 16 C39.1 16 40 16.9 40 18 L40 22 L18 22 Z" fill="#ffffff" opacity="0.3"/>
  <!-- Decorative Document Lines -->
  <line x1="22" y1="26" x2="34" y2="26" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="22" y1="32" x2="30" y2="32" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <!-- Plus Badge on top right -->
  <circle cx="36" cy="14" r="7" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="36" y1="10" x2="36" y2="18" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="14" x2="40" y2="14" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
