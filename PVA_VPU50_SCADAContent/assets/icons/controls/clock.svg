<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="clockDial" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="80%" stop-color="#071a2e"/>
      <stop offset="100%" stop-color="#020d18"/>
    </radialGradient>
    <linearGradient id="clockRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="clockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Top Push Button -->
  <rect x="21" y="2" width="6" height="5" rx="1.5" fill="#38bdf8"/>
  <rect x="18" y="5" width="12" height="3" rx="1.5" fill="#0284c7"/>
  <!-- Bezel Outer Ring -->
  <circle cx="24" cy="27" r="19" fill="url(#clockRim)" filter="url(#clockShadow)"/>
  <!-- Inner Dial -->
  <circle cx="24" cy="27" r="15.5" fill="url(#clockDial)" stroke="#38bdf8" stroke-width="1"/>
  <!-- Dial Tick Marks -->
  <line x1="24" y1="14" x2="24" y2="16.5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="37.5" x2="24" y2="40" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="11" y1="27" x2="13.5" y2="27" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="34.5" y1="27" x2="37" y2="27" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <!-- Progress Arc Segment (Active Timing Wedge) -->
  <path d="M24 27 L24 16 A11 11 0 0 1 35 27 Z" fill="#38bdf8" opacity="0.25"/>
  <!-- Hands -->
  <!-- Hour Hand -->
  <line x1="24" y1="27" x2="24" y2="18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Minute Hand -->
  <line x1="24" y1="27" x2="33" y2="27" stroke="url(#needleGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Center Cap -->
  <circle cx="24" cy="27" r="3.5" fill="#fbbf24" stroke="#ffffff" stroke-width="1"/>
</svg>