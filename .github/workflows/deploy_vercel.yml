name: Deploy Qt SCADA to Vercel

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Latest LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56

      - name: Install System Dependencies & Qt
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dev libglvnd0 libxkbcommon-x11-0
          pip install aqtinstall ninja cmake
          # Install Linux Desktop Host Tools
          python3 -m aqt install-qt linux desktop 6.8.2 linux_gcc_64 -m qtquick3d qtquicktimeline qtshadertools --base https://download.qt.io -O $HOME/Qt || python3 -m aqt install-qt linux desktop 6.8.2 linux_gcc_64 --base https://download.qt.io -O $HOME/Qt
          # Install WebAssembly Target
          python3 -m aqt install-qt all_os wasm 6.8.2 wasm_singlethread -m qtquick3d qtquicktimeline qtshadertools --base https://download.qt.io -O $HOME/Qt || python3 -m aqt install-qt all_os wasm 6.8.2 wasm_singlethread --base https://download.qt.io -O $HOME/Qt
          
          # Ensure executable permissions on extracted Qt tools
          chmod -R +x $HOME/Qt/6.8.2/gcc_64/bin || true
          chmod -R +x $HOME/Qt/6.8.2/gcc_64/libexec || true
          chmod -R +x $HOME/Qt/6.8.2/wasm_singlethread/bin || true
          chmod -R +x $HOME/Qt/6.8.2/wasm_singlethread/libexec || true
          
          # Add to Environment
          echo "$HOME/Qt/6.8.2/gcc_64/bin" >> $GITHUB_PATH
          echo "$HOME/Qt/6.8.2/wasm_singlethread/bin" >> $GITHUB_PATH

      - name: Build WebAssembly Application
        run: |
          chmod +x $HOME/Qt/6.8.2/wasm_singlethread/bin/qt-cmake || true
          $HOME/Qt/6.8.2/wasm_singlethread/bin/qt-cmake -B build_wasm -S . -DCMAKE_BUILD_TYPE=Release -G Ninja -DQT_HOST_PATH=$HOME/Qt/6.8.2/gcc_64
          cmake --build build_wasm --parallel $(nproc)
          mkdir -p dist
          # Copy only web deployment assets (*.html, *.js, *.wasm, *.svg, *.png, *.json, *.ico)
          find build_wasm -maxdepth 2 -type f \( -name "*.html" -o -name "*.js" -o -name "*.wasm" -o -name "*.svg" -o -name "*.png" -o -name "*.json" -o -name "*.ico" \) -exec cp {} dist/ \;
          if [ -f "dist/PVA_VPU50_SCADAApp.html" ]; then
            cp dist/PVA_VPU50_SCADAApp.html dist/index.html
          elif [ -f "dist/App.html" ]; then
            cp dist/App.html dist/index.html
          elif [ -f "dist/PVA_VPU50_SCADA.html" ]; then
            cp dist/PVA_VPU50_SCADA.html dist/index.html
          fi
          cp vercel.json dist/ 2>/dev/null || true
          cp PVA_VPU50_SCADAContent/assets/icons/header/favicon.svg dist/favicon.svg 2>/dev/null || true
          cp PVA_VPU50_SCADAContent/assets/icons/header/favicon.svg dist/favicon.ico 2>/dev/null || true
          echo "Contents of dist for Vercel deployment:"
          ls -lh dist/

      - name: Validate Build Output (Atomic Rollback Protection)
        run: |
          echo "Validating WebAssembly build artifacts..."
          if [ ! -f "dist/index.html" ]; then
            echo "::error ::CRITICAL: dist/index.html was not generated! Aborting deployment to preserve last working production version on Vercel."
            exit 1
          fi
          WASM_COUNT=$(find dist -name "*.wasm" | wc -l)
          if [ "$WASM_COUNT" -eq 0 ]; then
            echo "::error ::CRITICAL: No .wasm binaries found in dist! Aborting deployment to preserve last working production version on Vercel."
            exit 1
          fi
          echo "Validation PASSED ($WASM_COUNT WASM files found). Ready for zero-downtime deployment."

      - name: Deploy to Vercel (Production Zero-Downtime)
        if: success()
        run: |
          mkdir -p .vercel
          echo '{"projectId":"${{ secrets.VERCEL_PROJECT_ID }}","orgId":"${{ secrets.VERCEL_ORG_ID }}"}' > .vercel/project.json
          npx vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        working-directory: ./dist
