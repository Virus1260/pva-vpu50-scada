<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="checkBadge" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="70%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
    <linearGradient id="checkGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <filter id="checkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Verified Outer Shield/Circle -->
  <circle cx="24" cy="24" r="20" fill="url(#checkBadge)" stroke="#86efac" stroke-width="1.5" filter="url(#checkShadow)"/>
  <!-- Specular Top Gloss Highlight -->
  <ellipse cx="24" cy="12" rx="14" ry="6" fill="#ffffff" opacity="0.25"/>
  <!-- Solid High-Visibility Checkmark -->
  <polyline points="14,24 21,31 34,17" fill="none" stroke="url(#checkGlow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
