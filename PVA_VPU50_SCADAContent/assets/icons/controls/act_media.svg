<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="mediaBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mediaScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="mediaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Tablet Frame -->
  <rect x="6" y="6" width="36" height="36" rx="6" fill="url(#mediaBody)" stroke="#38bdf8" stroke-width="2" filter="url(#mediaShadow)"/>
  <!-- Display Screen -->
  <rect x="10" y="10" width="28" height="28" rx="3" fill="url(#mediaScreen)"/>
  <!-- Top Specular Highlight -->
  <path d="M10 10 L38 10 L38 20 L10 26 Z" fill="#ffffff" opacity="0.15"/>
  <!-- Media Play Triangle -->
  <polygon points="21,18 31,24 21,30" fill="#ffffff" stroke="#e0f2fe" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Bottom Status Dot -->
  <circle cx="24" cy="40" r="1.5" fill="#38bdf8"/>
</svg>
